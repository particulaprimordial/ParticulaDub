cmake_minimum_required(VERSION 3.22)
project(ParticulaDub VERSION 0.1.0)[cite: 2]

include(FetchContent)
FetchContent_Declare(JUCE
    GIT_REPOSITORY https://github.com/juce-framework/JUCE.git
    GIT_TAG 8.0.6
    GIT_SHALLOW TRUE)[cite: 2]
FetchContent_MakeAvailable(JUCE)[cite: 2]

juce_add_plugin(ParticulaDub
    COMPANY_NAME "Particula Primordial"
    BUNDLE_ID "com.particulaprimordial.particuladub"
    IS_SYNTH TRUE
    NEEDS_MIDI_INPUT TRUE
    NEEDS_MIDI_OUTPUT FALSE
    PLUGIN_MANUFACTURER_CODE Ppri
    PLUGIN_CODE Pdub
    FORMATS VST3 Standalone
    COPY_PLUGIN_AFTER_BUILD FALSE
    PRODUCT_NAME "Particula Dub")[cite: 2]

target_sources(ParticulaDub PRIVATE
    Source/PluginProcessor.h
    Source/PluginProcessor.cpp)[cite: 2]

target_compile_definitions(ParticulaDub PUBLIC
    JUCE_WEB_BROWSER=0
    JUCE_USE_CURL=0
    JUCE_VST3_CAN_REPLACE_VST2=0)[cite: 2]

target_link_libraries(ParticulaDub
    PRIVATE
        juce::juce_audio_utils
        juce::juce_dsp
    PUBLIC
        juce::juce_recommended_config_flags
        juce::juce_recommended_lto_flags
        juce::juce_recommended_warning_flags)
